ignore_table_names: false

table_mappings:
  - source: source
    destination: dest
    enabled: true
attribute_mappings:
- source: type
  target: datatype
  enabled: true
  compare: true
- source: length
  target: length
  enabled: true
  compare: true
- source: precision
  target: precision
  enabled: true
  compare: true
- source: scale
  target: scale
  enabled: true
  compare: true
ignored_attributes: []
missing_attribute:
  severity: WARNING
  fail: false
xml:
  enabled: true
  object_type: DataSource
  validate_object_types:
  - DataSource:field
  validate_scope: selected_objects
  attribute_mappings:
  - source: name
    target: name
    enabled: true
    compare: true
  - source: type
    target: datatype
    enabled: true
    compare: true
  - source: allowNulls
    target: nullable
    enabled: true
    compare: true
  - source: description
    target: comment
    enabled: true
    compare: true
  - source: default
    target: default
    enabled: true
    compare: true
  - source: displayFormat
    target: display_format
    enabled: true
    compare: true
  - source: length
    target: length
    enabled: false
    compare: true
  - source: precision
    target: precision
    enabled: false
    compare: true
  - source: scale
    target: scale
    enabled: false
    compare: true
  - source: isIdentity
    target: identity
    enabled: false
    compare: true

  ignored_attributes: []
  missing_attribute:
    severity: WARNING
    fail: false
  ignored_properties:
  - syntheticContent
  - lookupSource
  - parentFields
  - isCountFieldFor
  datatype_map:
    STRING: VARCHAR
    VARCHAR: VARCHAR
    CHAR: CHAR
    INTEGER: INTEGER
    INT: INTEGER
    LONG: BIGINT
    BIGINT: BIGINT
    DECIMAL: DECIMAL
    DOUBLE: DOUBLE
    FLOAT: FLOAT
    DATE: DATE
    DATETIME: DATETIME
    TIMESTAMP: TIMESTAMP
    BOOLEAN: BOOLEAN

value_mappings:
  - attribute: datatype
    source: TEXT
    target: VARCHAR
    enabled: true
  - attribute: datatype
    source: STRING
    target: VARCHAR
    enabled: true
